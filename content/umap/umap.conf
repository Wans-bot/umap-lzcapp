# lazycat 覆盖配置（由 UMAP_SETTINGS 指向本文件）。
# 上游默认 LANGUAGE_CODE = "en"；这里改为简体中文：
#   - 默认访问前缀变为 /zh/，未带前缀的 URL 会重定向到 /zh/；
#   - 前端加载 umap/static/umap/locale/zh.js；
#   - 后端加载 umap/locale/zh/LC_MESSAGES/django.mo；
# 三种资源均为上游 3.8.1 自带，不存在自行翻译。
LANGUAGE_CODE = "zh"

# 新地图默认中心点（北京，缩放 5 级），便于中文用户直接看到国内区域。
LEAFLET_LONGITUDE = 116.397
LEAFLET_LATITUDE = 39.909
LEAFLET_ZOOM = 5
